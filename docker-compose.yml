# =========================================================================
# Gerador de Contrato de Arrendamento
# =========================================================================
# Uso:
#   docker compose up -d --build     → build + sobe em background
#   docker compose logs -f           → ver logs
#   docker compose down              → parar e remover
# =========================================================================

services:
  contrato-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gerador-contrato:latest
    container_name: gerador-contrato

    # Publica a porta 80 do container na porta 80 do host.
    # Se a 80 já estiver em uso (ex.: Apache/Nginx no host), troque a
    # esquerda para "8080:80" e acesse via http://IP:8080
    ports:
      - "90:80"

    # Auto-start + auto-recuperação.
    # - Sobe sozinho quando o Docker daemon inicia (após reboot)
    # - Reinicia se o processo cair
    # - NÃO reinicia se você parar manualmente (docker compose down)
    restart: unless-stopped

    # Healthcheck: confirma que o Nginx está servindo antes de marcar como "healthy"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Boas práticas leves (sem exagerar em hardening para não complicar)
    environment:
      - TZ=America/Sao_Paulo

    # Persiste /data/config.json (chaves de API, tipos de contrato, etc.)
    # fora do container, para não se perder em rebuilds/recriações.
    volumes:
      - contrato-dados:/data

volumes:
  contrato-dados:
